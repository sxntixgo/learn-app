openapi: 3.1.0
info:
  title: Learn Platform API
  version: 0.1.0
  description: Self-hosted learning platform API
servers:
  - url: http://localhost:3001
    description: Development server

paths:
  /api/v1/health:
    get:
      summary: Health check endpoint
      description: Returns the current status of the API
      operationId: getHealth
      tags:
        - system
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/v1/auth/login:
    post:
      summary: Sign in with email and password
      description: >-
        Verifies the credential and, on success, starts a session: sets the
        httpOnly access-token and refresh-token cookies (design §13) and
        records an `auth.login` audit_log row. There is no account oracle
        (design §13/auth.ts) — an unknown email, a wrong password, and an
        account with no credential (`password_hash is null`) all produce the
        identical 401 body, the identical status, and the same Argon2id work.
        Rate-limited per IP and per account, with doubling backoff (design
        §13); a locked-out attempt is refused with 429 before the lookup or
        the hash, so lockout cannot be used as a CPU sink either.
      operationId: login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Both session cookies are set.
          headers:
            Set-Cookie:
              description: >-
                learn_at (path=/) and learn_rt (path=/api/v1/auth), both
                httpOnly, Secure, SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: email and/or password missing, or the password exceeds the length limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Invalid email or password. Identical body and status whether the
            account does not exist, the password is wrong, or the account has
            no credential at all — see the operation description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: >-
            Too many login attempts for this IP or account. `Retry-After`
            carries the number of seconds until the next attempt may proceed.
          headers:
            Retry-After:
              description: Seconds until the caller may try again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh token and mint a new access token
      description: >-
        Reads the `learn_rt` cookie, rotates it, and re-reads the caller's
        roles from the database (design §13: "role is in the token for cheap
        reads; privileged mutations re-check the database, so a demotion
        takes effect immediately rather than at next refresh" — refresh is
        the other place a stale role claim gets a chance to correct itself).
        Presenting an already-spent refresh token is treated as token theft
        (design §13 reuse detection): the whole token family is revoked, an
        `auth.refresh_reuse_detected` audit_log row is written, and both
        cookies are cleared, killing the session everywhere until the next
        password login. Every failure — missing cookie, unknown token,
        expired token, revoked token, or reuse — answers with the identical
        401 body, and always clears both cookies, so a client holding a dead
        token is never left retrying it forever.
      operationId: refreshSession
      tags:
        - auth
      responses:
        '200':
          description: A fresh session. Both cookies are re-set.
          headers:
            Set-Cookie:
              description: >-
                learn_at (path=/) and learn_rt (path=/api/v1/auth), both
                httpOnly, Secure, SameSite=Lax.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: >-
            No refresh cookie, or it is unknown, expired, revoked, or reused.
            Both session cookies are cleared on this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      summary: End the current session
      description: >-
        Revokes the session named by the `learn_rt` cookie (if any) and
        clears both cookies. Keyed off the refresh cookie rather than the
        actor so signing out still works once the access token has already
        expired — exactly when a visitor reaches for this control. Always
        succeeds, including with no cookie at all: signing out is never an
        error.
      operationId: logout
      tags:
        - auth
      responses:
        '204':
          description: Signed out. Both session cookies are cleared.

  /api/v1/auth/logout-all:
    post:
      summary: End every session on every device
      description: >-
        Revokes every refresh-token family belonging to the caller (design
        §13's "sign out everywhere" control) and clears the caller's own
        cookies. Gated by `session:revoke:all`, decided by `can()` like every
        other route — an unauthenticated caller is refused with 403, not a
        locally written 401 check (CLAUDE.md rule 2).
      operationId: logoutAll
      tags:
        - auth
      responses:
        '204':
          description: Every session is revoked. The caller's own cookies are cleared.
        '403':
          description: No valid session — refused by can(), same as any other protected route.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses:
    get:
      summary: List all courses
      description: >-
        Returns a summary of every imported course, for the catalog page.
        Archived modules/lessons are excluded from moduleCount/lessonCount.
      operationId: listCourses
      tags:
        - courses
      responses:
        '200':
          description: Course summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseSummary'

  /api/v1/courses/{courseSlug}:
    get:
      summary: Get a course's full table of contents
      description: >-
        Returns the course, its tracks, and every non-archived module with
        its non-archived lessons, in manifest order — enough to render a
        full table of contents.
      operationId: getCourse
      tags:
        - courses
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      responses:
        '200':
          description: Course found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Publish/set a course's visibility, or transfer its ownership
      description: >-
        Accepts `visibility` and/or `ownerId`. `visibility` is gated by
        `course:visibility:set` (design §12: the owning teacher, or an
        admin override); `ownerId` is gated by `course:ownership:transfer`
        (admin only). Either field may be omitted, but at least one is
        required. Neither write happens unless its own permission check
        passes — a request naming both fields where the actor may only
        change one is refused entirely, before anything is written.
      operationId: patchCourse
      tags:
        - courses
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePatchRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseManage'
        '400':
          description: Neither field was provided, or a field's value is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The actor may not make this change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Course not found — also returned for a hidden course the actor
            cannot discover, rather than 403 (design §12: a 403 would
            confirm the course exists).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/manage:
    get:
      summary: The course's settings view (owner/admin only)
      description: >-
        Gated by `course:manage:read`, unconditional on visibility — this
        is how a teacher-only owner (no student role) reads their own
        course, and how an admin reaches any course regardless of
        visibility. A denial is always reported as 404, never 403: this
        endpoint has nothing to disclose to anyone it is not the settings
        screen for.
      operationId: getCourseManage
      tags:
        - courses
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      responses:
        '200':
          description: Course settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseManage'
        '404':
          description: Not found, or not visible to this actor as a manager
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/enrolments:
    post:
      summary: Self-enrol in a course
      description: >-
        Gated by `course:enrol` (design §12): allowed in an `open` course,
        or in any course the actor owns (the self-enrollment design §5
        describes for a teacher's own course, published or not).
        `restricted` refuses self-enrolment for anyone but the owner —
        Phase 13's course invites are not built yet. Idempotent: enrolling
        twice leaves exactly one row, `status = 'active'`.
      operationId: createEnrolment
      tags:
        - courses
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      responses:
        '200':
          description: Enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '403':
          description: Refused — not eligible (wrong visibility, or an admin, who can never enrol)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found, or hidden and undiscoverable to this actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Un-enrol from a course
      description: >-
        Soft delete: the enrollment row's `status` flips to `withdrawn`
        rather than being removed (design §7: user tables are source of
        truth, nothing under `users` is recoverable). Re-enrolling flips it
        back to `active` on the same row. A harmless no-op if the actor was
        never enrolled.
      operationId: deleteEnrolment
      tags:
        - courses
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      responses:
        '200':
          description: Not enrolled (either just withdrawn, or already wasn't)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '403':
          description: Refused by the current policy check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/progress:
    post:
      summary: Mark or update a lesson's progress for the current actor
      description: >-
        Upserts lesson_progress for the actor. Idempotent: marking a lesson
        complete more than once leaves exactly one lesson_progress row and
        emits exactly one lesson_completed activity event. Only lessons of
        kind "lesson" may be marked complete through this endpoint —
        exercises complete on submission and quizzes complete on passing, in
        later phases; requesting state "complete" against either kind
        returns 409.
      operationId: upsertLessonProgress
      tags:
        - progress
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpsertRequest'
      responses:
        '200':
          description: Progress recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonProgressDetail'
        '404':
          description: Course or lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The lesson's kind cannot be marked complete directly (only
            kind "lesson" can — exercises and quizzes complete through
            other mechanisms).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/quiz:
    post:
      summary: Submit and score a quiz attempt
      description: >-
        Scores `answers` server-side against the lesson's stored quiz
        block (design §9.1: quizzes are machine-scored, and complete ONLY
        by passing — never by direct completion, which 409s on
        POST .../progress for kind "quiz"). Always records a
        quiz_attempts row, win or lose; retaking is allowed. On a pass,
        marks the lesson complete and emits a quiz_passed activity event
        — idempotent, so passing more than once never emits a second
        event or re-completes an already-complete lesson. Only lessons of
        kind "quiz" may be scored here; any other kind returns 409.
      operationId: submitQuizAttempt
      tags:
        - progress
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
      responses:
        '200':
          description: Scored result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizSubmitResult'
        '400':
          description: answers is missing or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course or lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This lesson is not kind "quiz"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/submission:
    get:
      summary: Get the actor's own exercise submission
      description: >-
        Returns the actor's submission for this exercise lesson — draft,
        submitted, or returned — including its frozen snapshot (design
        §9.4: "submissions snapshot the block content as presented") and
        the actor's own annotations against it. Scoped to the actor's own
        submission only; there is no way to name another user's through
        this route (a teacher's view of a student's submission is
        `submission:grade`, a later phase). 404 when the actor has not
        started this exercise yet, same as when the course or lesson does
        not exist — "not started" is not an error state, but there is
        nothing to return.
      operationId: getSubmission
      tags:
        - submissions
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      responses:
        '200':
          description: The actor's submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '403':
          description: The policy denied this request (e.g. no session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            Course not found, lesson not found, or the actor has not yet
            started this exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Save a draft of the actor's exercise submission
      description: >-
        Replaces the actor's draft annotations wholesale (not an append —
        the caller sends the full current set every time). On the first
        save, freezes a snapshot of the lesson's blocks as currently
        presented (design §9.4) and every later save — including this
        one, if it is not the first — validates annotation anchors against
        THAT STORED SNAPSHOT, never against the live lesson, so editing
        the lesson afterward cannot silently move where an annotation
        points. An anchor that does not fit the snapshot is refused (400),
        never clamped. A submission that is already `submitted` or
        `returned` refuses further draft writes (409) — that work is
        finished. Only lessons of kind "exercise" accept submissions; any
        other kind returns 409.
      operationId: saveSubmissionDraft
      tags:
        - submissions
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionDraftRequest'
      responses:
        '200':
          description: The saved draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: >-
            annotations is missing or malformed, or an annotation's anchor
            does not fit the snapshot (an out-of-range line, or a block
            that is not an annotatable code block)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The policy denied this request (e.g. no session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course or lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            This lesson is not kind "exercise", or the submission has
            already been submitted or returned and can no longer be
            edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/submission/submit:
    post:
      summary: Submit the actor's exercise
      description: >-
        Hands in the current draft. Takes no body — drafts are written
        through PUT .../submission, and keeping the two apart is what
        makes submitting idempotent: retrying this call after a successful
        submit returns the same submission unchanged rather than erroring
        or emitting a second event. Submitting an exercise that was never
        opened as a draft is legitimate (an exercise may be answered with
        no annotations at all) and still freezes a snapshot. Design §9.1:
        the lesson completes on submit, not on teacher return — a private
        course of one has no grader — and this emits exactly one
        `exercise_submitted` activity event. Only lessons of kind
        "exercise" may be submitted here; any other kind returns 409.
      operationId: submitSubmission
      tags:
        - submissions
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      responses:
        '200':
          description: >-
            The submitted submission. Returned unchanged, with the same
            status code, on a retried submit of an already-submitted or
            already-returned submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '403':
          description: The policy denied this request (e.g. no session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course or lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This lesson is not kind "exercise"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/submissions/{userId}:
    get:
      summary: Get one student's exercise submission (teacher grading view)
      description: >-
        A teacher's view of a specific student's submission — the same
        payload GET .../submission returns for the student themself,
        including `rubricScores`. Gated by `submission:grade`, scoped to
        courses the actor OWNS (design §9.4: "visible to the student who
        wrote it and to teachers of the owning course"); a teacher who does
        not own this course gets 403, not a course-shaped 404, so "this
        course exists but isn't yours" is distinguishable from "no such
        course" the same way every other ownership-gated route in this API
        already behaves.
      operationId: getSubmissionForGrading
      tags:
        - grading
      parameters:
        - name: courseSlug
          in: path
          required: true
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: The student's user id.
          schema:
            type: string
      responses:
        '200':
          description: The student's submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '403':
          description: The policy denied this request (no session, or a course the actor does not own)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found, lesson not found, or this student has no submission for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}/submissions/{userId}/grade:
    post:
      summary: Grade a student's exercise submission
      description: >-
        Scores rubric criteria and adds annotations in one operation (design
        §9.4, Task C), then returns the submission: sets `status` to
        `returned`, stamps `returnedAt` (first grade call only — a re-grade
        does not move it), and emits exactly one `exercise_returned`
        activity event ever for this submission, however many times it is
        graded. Re-grading is allowed — see
        db/migrations/0012_rubric_scores.sql for why — and never deletes an
        annotation, so a student cannot silently lose feedback they have
        already read. Refuses a submission that is still `draft` (409):
        there is nothing to grade until the student hands it in. Gated by
        `submission:grade` (and `rubric:score` when `rubricScores` is
        non-empty), scoped to courses the actor owns.
      operationId: gradeSubmission
      tags:
        - grading
      parameters:
        - name: courseSlug
          in: path
          required: true
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          description: The student's user id.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeRequest'
      responses:
        '200':
          description: The graded (now returned) submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          description: >-
            Malformed input; an annotation anchor that does not fit the
            snapshot; a reply's parentId naming a non-existent annotation, an
            annotation on a different submission, or an annotation that is
            itself a reply (threading is one level); or rubricScores that do
            not exactly cover the exercise's declared criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The policy denied this request (no session, or a course the actor does not own)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Course not found, lesson not found, or this student has no submission for it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: This lesson is not kind "exercise", or the submission is still a draft (not yet submitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/grading/queue:
    get:
      summary: List submissions awaiting review across the courses the actor owns
      description: >-
        Design §9.4: "Teachers get a queue of submissions awaiting review
        across the courses they own." Every `submitted` (not yet
        `returned`) exercise submission on a course the actor owns,
        oldest submitted first — the order a queue is worked. Spans
        every course the actor owns, not one course at a time; a
        submission on a course the actor does not own never appears
        here. Gated by `submission:queue:read`, a role floor for
        teachers — the actual per-course scoping happens in the query,
        keyed off the actor's own id, not off a single course's
        ownership like `submission:grade`. Empty, never an error, for a
        teacher who owns no courses or none awaiting review, and for an
        archived lesson's submissions (the same visibility every other
        lesson-scoped route in this API already gives archived content).
      operationId: getGradingQueue
      tags:
        - grading
      responses:
        '200':
          description: Submissions awaiting review, oldest submitted first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradingQueueItem'
        '403':
          description: The policy denied this request (e.g. no session, or not a teacher)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/courses/{courseSlug}/progress:
    get:
      summary: Get the actor's progress summary for a course
      description: >-
        Returns the course's total non-archived lesson count, how many the
        actor has completed, the completion percent, and each lesson's
        individual state. Archived lessons never count toward the totals.
      operationId: getCourseProgress
      tags:
        - progress
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
      responses:
        '200':
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressSummary'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/me:
    get:
      summary: Get the current actor's profile
      description: >-
        Returns the actor's id, display name, and effective timezone.
        `timezoneSource` is "default" when `users.timezone` is null and the
        UTC fallback (design §15) is being used, "set" otherwise — so the UI
        can prompt for confirmation only when a real value hasn't been
        chosen yet.
      operationId: getMe
      tags:
        - me
      responses:
        '200':
          description: The actor's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
    patch:
      summary: Update the current actor's timezone
      description: >-
        Sets `users.timezone`. The value must be a real IANA time zone name
        (validated via Intl) — storing anything else would silently break
        every heatmap/streak bucket query, which key off this column.
        Changing timezone shifts historical day buckets and may
        retroactively alter a streak (design §15); badges already earned
        are never revoked.
      operationId: updateMe
      tags:
        - me
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          description: timezone is missing or not a real IANA zone name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/me/activity:
    get:
      summary: The actor's recent activity feed
      description: >-
        Recent activity_events for the actor, newest first, with enough
        joined course/lesson context to render (design §10). course/lesson
        are null for event types not tied to either.
      operationId: getMyActivity
      tags:
        - activity
      parameters:
        - name: limit
          in: query
          required: false
          description: Max events to return. Defaults to 20, clamped to [1, 100].
          schema:
            type: integer
      responses:
        '200':
          description: The activity feed, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityEvent'

  /api/v1/me/heatmap:
    get:
      summary: The actor's activity heatmap
      description: >-
        A contiguous run of local calendar days (design §15: bucketed in the
        actor's IANA timezone, falling back to UTC when unset) with an
        activity count each — days with zero activity are present with
        count 0, never omitted, so the UI never has to infer a gap. Also
        returns current/longest streak (design §10), computed fresh from
        activity_events, not a stored counter.
      operationId: getMyHeatmap
      tags:
        - activity
      parameters:
        - name: weeks
          in: query
          required: false
          description: >-
            Trailing window size in weeks (7 days each), ending today.
            Defaults to 53, clamped to [1, 53]; narrower clients request
            fewer (design §10: ~13 on phone, ~26 on tablet).
          schema:
            type: integer
      responses:
        '200':
          description: The heatmap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heatmap'

  /api/v1/courses/{courseSlug}/lessons/{lessonSlug}:
    get:
      summary: Get a lesson within a course
      description: >-
        Retrieves a lesson with all its blocks, plus prev/next navigation
        stubs computed across the whole course in manifest order (not just
        within the lesson's module). An archived lesson (or a lesson whose
        module is archived) is not reachable here and returns 404.
      operationId: getCourseLesson
      tags:
        - lessons
      parameters:
        - name: courseSlug
          in: path
          required: true
          description: The course slug
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          description: The lesson slug (unique within the course)
          schema:
            type: string
      responses:
        '200':
          description: Lesson found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '404':
          description: Course or lesson not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/imports:
    post:
      summary: Import a content repo (streamed)
      description: >-
        UNAUTHENTICATED UNTIL PHASE 6 (see the route source for the full
        note) — acceptable only because the app is LAN-only until Gate 6.
        Clones `url` at `ref` (default the repo's default branch),
        validates its manifest and lessons, then writes it in one
        transaction (design §8). Runs synchronously — there is deliberately
        no job queue (design §4) — and streams progress as it happens, one
        JSON object per line (newline-delimited JSON, not a single JSON
        body), `Content-Type: application/x-ndjson`. Every line matches
        ImportProgressEvent. A `file://` URL is always refused: the clone
        step never receives the internal opt-in that would allow one. On
        failure the LAST line's `problems` array is the same file:line
        problem list the CLI prints (design §8: "error quality is the
        authoring experience"), and an `import_runs` row is written either
        way — a failed import is not silently dropped from history.
      operationId: createAdminImport
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminImportRequest'
      responses:
        '200':
          description: >-
            A stream of newline-delimited ImportProgressEvent objects, one
            per line, ending with a 'done' or 'failed' event. Always 200:
            the HTTP status is set before the outcome of the import is
            known, since the import result arrives inside the stream body,
            not the status line.
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ImportProgressEvent'
        '400':
          description: url is missing/empty, or ref is present and not a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The actor is not permitted to import content repos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/import-runs:
    get:
      summary: Import run history
      description: >-
        UNAUTHENTICATED UNTIL PHASE 6, same note as POST
        /api/v1/admin/imports. Every import_runs row, newest first, with
        the repo URL it came from (if any — a local-directory import has
        none) and, for a finished run, either its per-entity counts or its
        error/problem list.
      operationId: listAdminImportRuns
      tags:
        - admin
      parameters:
        - name: limit
          in: query
          required: false
          description: Max runs to return. Defaults to 20, clamped to [1, 100].
          schema:
            type: integer
      responses:
        '200':
          description: The import run history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportRunSummary'
        '403':
          description: The actor is not permitted to read import history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/setup:
    get:
      summary: First-run setup status
      description: >-
        Whether this instance has been claimed yet (design §5.2). The
        bootstrap wizard calls this to decide whether to show itself. It
        reveals one bit, the same bit the 410 below already reveals.
      operationId: getSetupStatus
      tags:
        - setup
      responses:
        '200':
          description: The instance's bootstrap state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
    post:
      summary: Claim the instance (first-run bootstrap)
      description: >-
        The single exception to invite-only registration (design §13).
        Gated by the one-time setup token printed to the container logs on
        boot — the plaintext is never stored, only its SHA-256.

        Creates a LINKED PAIR (design §5.2): the operator account, holding
        `admin` and nothing else because admin is exclusive (design §5.1),
        and a student account, linked by `users.operator_for`. Both
        accounts and the claim itself are one transaction.

        The claim is atomic: `UPDATE instance_state SET bootstrapped_at =
        now() WHERE bootstrapped_at IS NULL`. Two simultaneous requests
        yield exactly one 201; the loser gets 409. Once claimed, the route
        is permanently closed and answers 410 — recorded in
        `instance_state`, not merely hidden from the UI.
      operationId: createSetup
      tags:
        - setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: The instance is claimed; the operator + student pair exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupResult'
        '400':
          description: >-
            The request body is malformed — bad email, non-URL-safe or
            reserved handle, short password, invalid timezone, or the two
            accounts sharing an email or handle. The claim is untouched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: >-
            Wrong, tampered or absent setup token. The claim is NOT
            consumed — the correct token still works afterwards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            The instance was unclaimed when this request arrived, and a
            concurrent request won the race.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: >-
            The instance was already set up before this request arrived.
            Permanent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    HealthStatus:
      type: object
      description: API health check response
      properties:
        status:
          type: string
          description: The status of the API (typically "ok")
      required:
        - status

    ProseBlock:
      type: object
      description: A prose (narrative) content block with rendered HTML
      properties:
        type:
          type: string
          enum:
            - prose
          description: The block type discriminator
        html:
          type: string
          description: The HTML-rendered content of the prose block
      required:
        - type
        - html

    CodeAnnotation:
      type: object
      description: >-
        A note attached to a source line or inclusive line range. Author
        annotations are authored in the content repo as in-source marker
        comments and stripped from the stored source at import; student
        annotations are created against an exercise. Exactly one of `line`
        or `lines` is present.
      required: [body]
      properties:
        line:
          type: integer
          minimum: 1
          description: The single 1-indexed source line this attaches to.
        lines:
          type: array
          items: { type: integer, minimum: 1 }
          minItems: 2
          maxItems: 2
          description: An inclusive [start, end] 1-indexed range.
        track:
          type: string
          minLength: 1
          description: Optional track id, matching a track's id in course.yaml.
        body:
          type: string
          minLength: 1
    CodeBlock:
      type: object
      description: A code block with syntax highlighting metadata
      properties:
        type:
          type: string
          enum:
            - code
          description: The block type discriminator
        lang:
          type:
            - string
            - "null"
          nullable: true
          description: The programming language or syntax identifier (null if not specified)
        source:
          type: string
          description: The raw source code
        annotations:
          type: array
          description: >-
            Annotations attached to lines of this block. Present on lessons whose
            content carries author notes, and on exercises.
          items:
            $ref: '#/components/schemas/CodeAnnotation'
      required:
        - type
        - source

    QuizChoice:
      type: object
      description: >-
        One answer choice for a quiz question, as served to the browser.
        Deliberately has no `correct` field — the API strips it before a
        lesson's blocks are serialized (design §9.1: quizzes are
        machine-scored server-side), so a reader checking page source
        cannot find the answer key. The stored form (used only by the
        scoring endpoint, never returned) does carry it.
      properties:
        text:
          type: string
          description: The choice's display text
      required:
        - text

    QuizQuestion:
      type: object
      description: One quiz question, as served to the browser.
      properties:
        prompt:
          type: string
          description: The question text
        track:
          type:
            - string
            - "null"
          nullable: true
          description: The key of the track (lens) this question belongs to, or null
        choices:
          type: array
          items:
            $ref: '#/components/schemas/QuizChoice'
          description: The question's answer choices, in order (referenced by index when submitting)
      required:
        - prompt
        - track
        - choices

    QuizBlock:
      type: object
      description: >-
        A quiz block (design §6.3: a tagged fenced block with YAML). `pass`
        is the passing threshold — the fraction of questions that must be
        answered correctly. Scoring never happens in this response; submit
        answers to POST .../quiz instead.
      properties:
        type:
          type: string
          enum:
            - quiz
          description: The block type discriminator
        pass:
          type: number
          description: Passing threshold as a fraction of correctly-answered questions, e.g. 0.7
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestion'
      required:
        - type
        - pass
        - questions

    RubricCriterion:
      type: object
      description: >-
        One rubric criterion (design §9.4). Declared in content, beside the
        exercise it grades — name, max points, and an optional track.
        Nothing here is stripped or hidden: unlike a quiz choice's
        `correct`, students read the criteria before submitting.
      properties:
        name:
          type: string
          description: >-
            The criterion's display name, and its identifier when a teacher
            scores it (matched against rubric_scores.criterion).
        max:
          type: number
          description: Maximum points this criterion is worth.
        track:
          type: string
          minLength: 1
          description: Optional track id, matching a track's id in course.yaml.
      required:
        - name
        - max

    RubricBlock:
      type: object
      description: >-
        A rubric block (design §9.4: "rubrics are declared in content,
        filled in by the teacher"). Declares the criteria a teacher scores
        this exercise against, published alongside the exercise so every
        student is measured against the same bar and can read it before
        submitting.
      properties:
        type:
          type: string
          enum:
            - rubric
          description: The block type discriminator
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/RubricCriterion'
      required:
        - type
        - criteria

    Block:
      oneOf:
        - $ref: '#/components/schemas/ProseBlock'
        - $ref: '#/components/schemas/CodeBlock'
        - $ref: '#/components/schemas/QuizBlock'
        - $ref: '#/components/schemas/RubricBlock'
      discriminator:
        propertyName: type
        mapping:
          prose: '#/components/schemas/ProseBlock'
          code: '#/components/schemas/CodeBlock'
          quiz: '#/components/schemas/QuizBlock'
          rubric: '#/components/schemas/RubricBlock'
      description: A content block, which may be prose, code, a quiz, or a rubric

    LessonNavStub:
      type: object
      description: A minimal pointer to an adjacent lesson, for prev/next navigation.
      properties:
        slug:
          type: string
          description: The adjacent lesson's slug (unique within the course)
        title:
          type: string
          description: The adjacent lesson's title
      required:
        - slug
        - title

    Lesson:
      type: object
      description: A lesson containing a title, structured blocks, and whole-course navigation.
      properties:
        slug:
          type: string
          description: The URL-friendly identifier for the lesson, unique within its course
        title:
          type: string
          description: The human-readable title of the lesson
        kind:
          type: string
          enum:
            - lesson
            - exercise
            - quiz
          description: The lesson's kind
        track:
          type:
            - string
            - "null"
          nullable: true
          description: The key of the track (lens) this lesson belongs to, or null
        estimateMinutes:
          type:
            - integer
            - "null"
          nullable: true
          description: Estimated minutes to complete the lesson, or null if not specified
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: The ordered array of content blocks
        prev:
          description: >-
            The previous lesson in the whole course, in manifest order, or
            null if this is the first lesson.
          oneOf:
            - $ref: '#/components/schemas/LessonNavStub'
            - type: "null"
        next:
          description: >-
            The next lesson in the whole course, in manifest order, or null
            if this is the last lesson.
          oneOf:
            - $ref: '#/components/schemas/LessonNavStub'
            - type: "null"
        progress:
          description: >-
            The actor's progress on this lesson, or null if they have never
            interacted with it.
          oneOf:
            - $ref: '#/components/schemas/LessonProgress'
            - type: "null"
      required:
        - slug
        - title
        - kind
        - track
        - estimateMinutes
        - blocks
        - prev
        - next
        - progress

    Track:
      type: object
      description: A course track (lens) — a hue-owning grouping lessons can belong to.
      properties:
        key:
          type: string
          description: The track's stable key, referenced by lessons
        name:
          type: string
          description: The human-readable track name
        hue:
          type: string
          enum:
            - blue
            - teal
            - ochre
            - maroon
            - slate
          description: The one hue this track owns
        blurb:
          type:
            - string
            - "null"
          nullable: true
          description: A short description of the track, or null
      required:
        - key
        - name
        - hue
        - blurb

    LessonSummary:
      type: object
      description: A lesson as it appears in a course's table of contents.
      properties:
        slug:
          type: string
          description: The lesson's slug, unique within its course
        title:
          type: string
          description: The lesson's title
        kind:
          type: string
          enum:
            - lesson
            - exercise
            - quiz
          description: The lesson's kind
        position:
          type: integer
          description: The lesson's position within its module (manifest order)
        track:
          type:
            - string
            - "null"
          nullable: true
          description: The key of the track (lens) this lesson belongs to, or null
        estimateMinutes:
          type:
            - integer
            - "null"
          nullable: true
          description: Estimated minutes to complete the lesson, or null if not specified
      required:
        - slug
        - title
        - kind
        - position
        - track
        - estimateMinutes

    CourseModule:
      type: object
      description: A course module and its ordered, non-archived lessons.
      properties:
        key:
          type: string
          description: The module's stable key
        title:
          type: string
          description: The module's title
        position:
          type: integer
          description: The module's position within the course (manifest order)
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
          description: The module's non-archived lessons, in manifest order
      required:
        - key
        - title
        - position
        - lessons

    CourseVisibility:
      type: string
      enum:
        - open
        - restricted
        - hidden
      description: >-
        design §12. `open` — listed, any student may self-enrol.
        `restricted` — listed, self-enrolment needs a teacher's invite.
        `hidden` — absent from the catalog; a direct fetch 404s for anyone
        but the owner or an admin. New courses land `hidden`; re-import
        never changes it.

    CourseSummary:
      type: object
      description: A course as it appears in the catalog listing.
      properties:
        slug:
          type: string
          description: The course's globally-unique slug
        title:
          type: string
          description: The course's title
        subtitle:
          type:
            - string
            - "null"
          nullable: true
          description: The course's subtitle, or null
        description:
          type:
            - string
            - "null"
          nullable: true
          description: The course's description, or null
        tags:
          type: array
          items:
            type: string
          description: The course's tags
        moduleCount:
          type: integer
          description: The count of the course's non-archived modules
        lessonCount:
          type: integer
          description: The count of the course's non-archived lessons
        visibility:
          $ref: '#/components/schemas/CourseVisibility'
      required:
        - slug
        - title
        - subtitle
        - description
        - tags
        - moduleCount
        - lessonCount
        - visibility

    CourseDetail:
      type: object
      description: A course's full table of contents.
      properties:
        slug:
          type: string
          description: The course's globally-unique slug
        title:
          type: string
          description: The course's title
        subtitle:
          type:
            - string
            - "null"
          nullable: true
          description: The course's subtitle, or null
        description:
          type:
            - string
            - "null"
          nullable: true
          description: The course's description, or null
        tags:
          type: array
          items:
            type: string
          description: The course's tags
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
          description: The course's tracks (lenses)
        modules:
          type: array
          items:
            $ref: '#/components/schemas/CourseModule'
          description: The course's non-archived modules, in manifest order
        visibility:
          $ref: '#/components/schemas/CourseVisibility'
        enrolled:
          type: boolean
          description: Whether the current actor holds an active enrollment in this course.
        canPublish:
          type: boolean
          description: >-
            Whether the current actor may change this course's visibility
            (course:visibility:set) — drives the web publish control
            (design plan phase 6 web). Server-computed; the client never
            re-derives ownership.
      required:
        - slug
        - title
        - subtitle
        - description
        - tags
        - tracks
        - modules
        - visibility
        - enrolled
        - canPublish

    CourseManage:
      type: object
      description: >-
        A course's settings view (GET/PATCH .../manage and .../courses/{slug}),
        gated by course:manage:read — the owner's/admin's screen, unconditional
        on visibility.
      properties:
        slug:
          type: string
          description: The course's globally-unique slug
        title:
          type: string
          description: The course's title
        subtitle:
          type:
            - string
            - "null"
          nullable: true
        description:
          type:
            - string
            - "null"
          nullable: true
        ownerId:
          type:
            - string
            - "null"
          nullable: true
          description: courses.owner_id (migration 0007). Null means no teacher owns it.
        visibility:
          $ref: '#/components/schemas/CourseVisibility'
      required:
        - slug
        - visibility

    CoursePatchRequest:
      type: object
      description: >-
        At least one of `visibility`/`ownerId` is required. `visibility` is
        gated by course:visibility:set; `ownerId` (a user id, or null to
        unassign) is gated by course:ownership:transfer (admin only).
      properties:
        visibility:
          $ref: '#/components/schemas/CourseVisibility'
        ownerId:
          type:
            - string
            - "null"
          nullable: true
          description: A user id to make the course's owner, or null to unassign.

    Enrolment:
      type: object
      description: The actor's enrollment state for one course, after a POST/DELETE.
      properties:
        enrolled:
          type: boolean
        enrolledAt:
          type: string
          format: date-time
          description: Present on a successful POST; omitted on DELETE.
      required:
        - enrolled

    ProgressState:
      type: string
      enum:
        - in_progress
        - complete
      description: The state a lesson_progress row can be written with.

    LessonProgress:
      type: object
      description: >-
        The actor's progress on a lesson, embedded in the lesson response so
        a reader can resume.
      properties:
        state:
          $ref: '#/components/schemas/ProgressState'
        lastPosition:
          type:
            - string
            - "null"
          nullable: true
          description: An opaque string the reader uses to resume, or null.
      required:
        - state
        - lastPosition

    LessonProgressDetail:
      type: object
      description: The full lesson_progress row for the actor, after an upsert.
      properties:
        state:
          $ref: '#/components/schemas/ProgressState'
        lastPosition:
          type:
            - string
            - "null"
          nullable: true
          description: An opaque string the reader uses to resume, or null.
        secondsSpent:
          type: integer
          description: Total seconds spent, as last recorded.
        completedAt:
          type:
            - string
            - "null"
          format: date-time
          nullable: true
          description: When the lesson was first marked complete, or null.
        updatedAt:
          type: string
          format: date-time
          description: When this progress row was last written.
      required:
        - state
        - lastPosition
        - secondsSpent
        - completedAt
        - updatedAt

    ProgressUpsertRequest:
      type: object
      description: A partial update to the actor's progress on a lesson.
      properties:
        state:
          $ref: '#/components/schemas/ProgressState'
        lastPosition:
          type:
            - string
            - "null"
          nullable: true
          description: An opaque string the reader uses to resume.
        secondsSpent:
          type: integer
          minimum: 0
          description: Total seconds spent on the lesson, replacing the stored value.

    CourseProgressLessonState:
      type: string
      enum:
        - not_started
        - in_progress
        - complete
      description: >-
        A lesson's progress state as it appears in a course summary. Unlike
        ProgressState, includes "not_started" for lessons with no
        lesson_progress row yet.

    CourseProgressLesson:
      type: object
      description: One lesson's state within a course progress summary.
      properties:
        slug:
          type: string
          description: The lesson's slug, unique within its course
        kind:
          type: string
          enum:
            - lesson
            - exercise
            - quiz
          description: The lesson's kind
        state:
          $ref: '#/components/schemas/CourseProgressLessonState'
      required:
        - slug
        - kind
        - state

    CourseProgressSummary:
      type: object
      description: >-
        The actor's progress summary for a course. Archived lessons never
        count toward totalLessons/completedLessons.
      properties:
        totalLessons:
          type: integer
          description: Count of the course's non-archived lessons.
        completedLessons:
          type: integer
          description: Count of those lessons the actor has completed.
        percent:
          type: integer
          description: completedLessons / totalLessons as a rounded percent (0 if totalLessons is 0).
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/CourseProgressLesson'
          description: Every non-archived lesson's individual state, in manifest order.
      required:
        - totalLessons
        - completedLessons
        - percent
        - lessons

    QuizAnswerInput:
      type: object
      description: One submitted answer, referencing the quiz block by index.
      properties:
        questionIndex:
          type: integer
          description: 0-based index into the quiz block's questions array
        choiceIndex:
          type: integer
          description: 0-based index into that question's choices array
      required:
        - questionIndex
        - choiceIndex

    QuizSubmitRequest:
      type: object
      description: A quiz submission — one answer per attempted question. Unanswered questions may be omitted.
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/QuizAnswerInput'
      required:
        - answers

    QuizQuestionResult:
      type: object
      description: >-
        One question's scored outcome. `correctChoiceIndex` is safe to
        return here (unlike on the lesson response) because scoring has
        already happened — this is feedback on an attempt, not the
        pre-attempt answer key.
      properties:
        questionIndex:
          type: integer
        track:
          type:
            - string
            - "null"
          nullable: true
        choiceIndex:
          type:
            - integer
            - "null"
          nullable: true
          description: The choice the actor submitted for this question, or null if unanswered.
        correctChoiceIndex:
          type: integer
        correct:
          type: boolean
      required:
        - questionIndex
        - track
        - choiceIndex
        - correctChoiceIndex
        - correct

    QuizTrackScore:
      type: object
      description: One track's correct/total count within a single attempt (design §9.1/§9.3).
      properties:
        correct:
          type: integer
        total:
          type: integer
      required:
        - correct
        - total

    QuizAttemptRef:
      type: object
      description: A pointer to the quiz_attempts row this submission wrote.
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - createdAt

    QuizSubmitResult:
      type: object
      description: The scored result of a quiz submission (design §9.1).
      properties:
        score:
          type: number
          description: Fraction of questions answered correctly, 0-1
        passed:
          type: boolean
        pass:
          type: number
          description: The block's own passing threshold, echoed back for the reader
        results:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionResult'
        trackScores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/QuizTrackScore'
        attempt:
          $ref: '#/components/schemas/QuizAttemptRef'
      required:
        - score
        - passed
        - pass
        - results
        - trackScores
        - attempt

    SubmissionStatus:
      type: string
      enum:
        - draft
        - submitted
        - returned
      description: >-
        A submission's lifecycle state (design §9.1/§9.4). `draft` accepts
        further PUT saves; `submitted` and `returned` are finished work and
        refuse them (409). Only `submitted` and `returned` have completed
        the lesson.

    SubmissionAnnotationInput:
      type: object
      description: >-
        One annotation as the client sends it when saving a draft
        (PUT .../submission). Anchors are 1-indexed and inclusive, and are
        validated against the submission's stored snapshot, never the live
        lesson (design §9.4) — an anchor that does not fit is refused
        (400), never clamped.
      properties:
        blockIndex:
          type: integer
          minimum: 0
          description: 0-based index into the submission's snapshot blocks array.
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
          description: Must be >= startLine.
        body:
          type: string
          minLength: 1
        track:
          type: string
          minLength: 1
          description: Optional track id, matching a track's id in course.yaml.
      required:
        - blockIndex
        - startLine
        - endLine
        - body

    SubmissionDraftRequest:
      type: object
      description: >-
        The full current set of the actor's draft annotations. A save
        replaces the set wholesale (not an append) — the caller sends
        every annotation it wants kept, every time.
      properties:
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionAnnotationInput'
      required:
        - annotations

    SubmissionAnnotation:
      type: object
      description: >-
        One annotation as stored and served back. Ids are server-assigned.
        `parentId` threads a reply to another annotation (design §9.4) —
        always null on a student's own annotations (Phase 8 writes only
        top-level ones), and set on a teacher's reply to a specific student
        comment during grading (Phase 9, POST .../grade). A teacher may also
        write a top-level annotation of their own (parentId null) to flag a
        line the student missed entirely. Threading is one level: a reply's
        OWN parentId is always null, because a reply to a reply is refused
        by the grade route rather than silently flattened.
      properties:
        id:
          type: string
        blockIndex:
          type: integer
        startLine:
          type: integer
        endLine:
          type: integer
        body:
          type: string
        track:
          type:
            - string
            - "null"
          nullable: true
        parentId:
          type:
            - string
            - "null"
          nullable: true
        authorId:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - blockIndex
        - startLine
        - endLine
        - body
        - track
        - parentId
        - authorId
        - createdAt

    RubricScore:
      type: object
      description: >-
        A teacher's score on one rubric criterion of a submission (design
        §9.4/§9.1, Task C). `criterion` matches a criterion `name` in the
        submission's own snapshot rubric block. Re-grading updates this row
        in place (`updatedAt` moves; `createdAt` stays put) rather than
        creating a second one — see db/migrations/0012_rubric_scores.sql for
        why re-grading is allowed at all.
      properties:
        id:
          type: string
        criterion:
          type: string
        points:
          type: number
        max:
          type: number
        track:
          type:
            - string
            - "null"
          nullable: true
        scoredBy:
          type: string
          description: The teacher's user id.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - criterion
        - points
        - max
        - track
        - scoredBy
        - createdAt
        - updatedAt

    GradeRubricScoreInput:
      type: object
      description: >-
        One criterion's score, as a teacher submits it to POST .../grade.
        Neither `max` nor `track` is accepted here — both are read from the
        submission's own snapshot rubric block server-side (matched by
        `criterion` name), so a caller cannot inflate a criterion's ceiling,
        or record a score against a track the criterion does not itself
        declare, by simply asserting one.
      properties:
        criterion:
          type: string
          minLength: 1
          description: Must match a criterion name declared in the submission's snapshot rubric block.
        points:
          type: number
          minimum: 0
          description: Must not exceed that criterion's declared max.
      required:
        - criterion
        - points

    GradeAnnotationInput:
      type: object
      description: >-
        One annotation a teacher adds while grading (design §9.4: a reply to
        a specific student comment, or a top-level annotation flagging a
        line the student missed). Exactly one of two shapes:
          - A REPLY: `parentId` set, referencing an existing TOP-LEVEL
            annotation on the same submission. Inherits that annotation's
            anchor (blockIndex/startLine/endLine) — do not send them on a
            reply; the server derives them from the parent so a reply can
            never be anchored somewhere the comment it answers is not.
          - A TOP-LEVEL annotation: `parentId` omitted or null, and
            blockIndex/startLine/endLine required and validated against the
            snapshot exactly as a student's own annotations are.
        A reply to a reply is refused (400) — threading is one level.
      properties:
        parentId:
          type:
            - string
            - "null"
          nullable: true
        blockIndex:
          type: integer
          minimum: 0
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        body:
          type: string
          minLength: 1
        track:
          type: string
          minLength: 1
      required:
        - body

    GradeRequest:
      type: object
      description: >-
        Scores criteria and adds annotations in one operation (Task C).
        `rubricScores`, when the exercise's snapshot declares a rubric
        block, MUST cover every declared criterion — a partial score set is
        refused (400) rather than silently leaving some criteria unscored.
        When there is no rubric block, `rubricScores` must be empty or
        omitted. `annotations` is always optional: a teacher may return a
        submission with scores only, replies only, both, or neither.
      properties:
        rubricScores:
          type: array
          items:
            $ref: '#/components/schemas/GradeRubricScoreInput'
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/GradeAnnotationInput'

    Submission:
      type: object
      description: >-
        An exercise submission (design §9.4). `snapshot` is the lesson's
        blocks AS PRESENTED when the submission was first saved or
        submitted, frozen for the submission's entire life — the reader
        renders from this, never from the live lesson, so editing the
        lesson afterward cannot change what a past submission shows.
        `annotations` anchor to this snapshot, not to the live lesson.
        `rubricScores` is empty until a teacher grades the submission
        (POST .../grade); a returned submission's rubricScores is exactly
        what the student sees as their feedback.
      properties:
        id:
          type: string
        lessonSlug:
          type: string
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        snapshot:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          description: The lesson's blocks as presented when first saved, frozen for the life of the submission.
        snapshotHash:
          type: string
          description: A content hash of the snapshot, for cheap equality checks.
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionAnnotation'
        rubricScores:
          type: array
          items:
            $ref: '#/components/schemas/RubricScore'
        submittedAt:
          type:
            - string
            - "null"
          nullable: true
          format: date-time
        returnedAt:
          type:
            - string
            - "null"
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - lessonSlug
        - status
        - snapshot
        - snapshotHash
        - annotations
        - rubricScores
        - submittedAt
        - returnedAt
        - createdAt
        - updatedAt

    GradingQueueItem:
      type: object
      description: >-
        One submission awaiting review, from GET /api/v1/grading/queue
        (design §9.4). Carries enough to list the queue and link straight
        into the grading view without a second fetch per row.
      properties:
        submissionId:
          type: string
        courseSlug:
          type: string
        courseTitle:
          type: string
        lessonSlug:
          type: string
        lessonTitle:
          type: string
        userId:
          type: string
          description: The student's user id.
        studentDisplayName:
          type:
            - string
            - "null"
          nullable: true
        studentHandle:
          type:
            - string
            - "null"
          nullable: true
        submittedAt:
          type: string
          format: date-time
      required:
        - submissionId
        - courseSlug
        - courseTitle
        - lessonSlug
        - lessonTitle
        - userId
        - studentDisplayName
        - studentHandle
        - submittedAt

    Error:
      type: object
      description: An error response
      properties:
        message:
          type: string
          description: A human-readable error message
      required:
        - message

    TimezoneSource:
      type: string
      enum:
        - set
        - default
      description: >-
        "set" when users.timezone holds a real value the actor chose;
        "default" when it is null and the UTC fallback (design §15) is in
        effect.

    Me:
      type: object
      description: The current actor's profile.
      properties:
        id:
          type: string
          description: The actor's user id
        displayName:
          type:
            - string
            - "null"
          nullable: true
          description: The actor's display name, or null if unset
        timezone:
          type: string
          description: >-
            The actor's effective IANA timezone — their stored value, or
            "UTC" when unset (design §15).
        timezoneSource:
          $ref: '#/components/schemas/TimezoneSource'
      required:
        - id
        - displayName
        - timezone
        - timezoneSource

    MeUpdateRequest:
      type: object
      description: A request to set the actor's timezone.
      properties:
        timezone:
          type: string
          description: A real IANA time zone name (e.g. "America/Denver").
      required:
        - timezone

    ActivityEventType:
      type: string
      enum:
        - lesson_completed
        - exercise_submitted
        - exercise_returned
        - quiz_passed
        - course_enrolled
        - course_completed
        - degree_earned
        - badge_awarded
      description: The kind of activity_events row (design §10).

    ActivityCourseRef:
      type: object
      description: Minimal course context for rendering a feed entry.
      properties:
        slug:
          type: string
          description: The course's slug
        title:
          type: string
          description: The course's title
      required:
        - slug
        - title

    ActivityLessonRef:
      type: object
      description: Minimal lesson context for rendering a feed entry.
      properties:
        slug:
          type: string
          description: The lesson's slug, unique within its course
        title:
          type: string
          description: The lesson's title
      required:
        - slug
        - title

    ActivityEvent:
      type: object
      description: One activity_events row, joined with enough context to render.
      properties:
        type:
          $ref: '#/components/schemas/ActivityEventType'
        occurredAt:
          type: string
          format: date-time
          description: When the event occurred, in UTC.
        course:
          description: The related course, or null if this event type has none.
          oneOf:
            - $ref: '#/components/schemas/ActivityCourseRef'
            - type: "null"
        lesson:
          description: The related lesson, or null if this event type has none.
          oneOf:
            - $ref: '#/components/schemas/ActivityLessonRef'
            - type: "null"
      required:
        - type
        - occurredAt
        - course
        - lesson

    HeatmapDay:
      type: object
      description: One local calendar day's activity count.
      properties:
        date:
          type: string
          description: The local calendar date, YYYY-MM-DD.
        count:
          type: integer
          description: Number of activity_events on this local day.
      required:
        - date
        - count

    Heatmap:
      type: object
      description: >-
        The actor's activity heatmap: a contiguous run of local days plus
        derived streaks (design §10, §15).
      properties:
        timezone:
          type: string
          description: The timezone the days were bucketed in.
        timezoneSource:
          $ref: '#/components/schemas/TimezoneSource'
        days:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapDay'
          description: Contiguous local days, oldest first, ending today.
        maxCount:
          type: integer
          description: The highest single-day count in `days`, for scaling the intensity ramp.
        currentStreak:
          type: integer
          description: Current streak in local calendar days, computed fresh from activity_events.
        longestStreak:
          type: integer
          description: Longest streak ever, in local calendar days, computed fresh from activity_events.
      required:
        - timezone
        - timezoneSource
        - days
        - maxCount
        - currentStreak
        - longestStreak

    AdminImportRequest:
      type: object
      description: A request to clone, validate, and import a content repo.
      properties:
        url:
          type: string
          description: >-
            The repo's git URL. Only https:// and ssh:// remotes are
            accepted (git@host:path is accepted as ssh); file://, git://,
            http:// and git's ext:: transport are always refused — see
            clone.ts's assertAllowedRepoUrl. This refusal cannot be
            disabled through this endpoint under any circumstances.
        ref:
          type: string
          description: Branch or tag to check out. Defaults to the repo's default branch.
      required:
        - url

    ImportStage:
      type: string
      enum:
        - cloning
        - validating
        - parsing
        - writing
        - done
        - failed
      description: One stage of the synchronous import pipeline (design §8).

    ImportEntityCounts:
      type: object
      description: Per-entity outcome of one import. `archived` is always 0 for courses and tracks.
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        archived:
          type: integer
      required:
        - created
        - updated
        - skipped
        - archived

    ImportCounts:
      type: object
      description: Every entity kind's outcome for one import.
      properties:
        courses:
          $ref: '#/components/schemas/ImportEntityCounts'
        tracks:
          $ref: '#/components/schemas/ImportEntityCounts'
        modules:
          $ref: '#/components/schemas/ImportEntityCounts'
        lessons:
          $ref: '#/components/schemas/ImportEntityCounts'
      required:
        - courses
        - tracks
        - modules
        - lessons

    ImportProgressEvent:
      type: object
      description: >-
        One line of the newline-delimited progress stream POST
        /api/v1/admin/imports returns. Only the fields relevant to `stage`
        are present on a given line — e.g. `problems` only appears on a
        'failed' line, `counts` only on 'done'.
      properties:
        stage:
          $ref: '#/components/schemas/ImportStage'
        message:
          type: string
          description: A short human-readable description of what's happening at this stage.
        problems:
          type: array
          items:
            type: string
          description: >-
            Present when stage is 'failed'. Every problem found, file:line
            formatted where applicable — the same list the CLI prints
            (design §8).
        importRunId:
          type: string
          description: The import_runs row this attempt was recorded under, once known.
        slug:
          type: string
          description: Present when stage is 'done'. The imported course's slug.
        commitSha:
          type: string
          description: Present when stage is 'done'. The commit the content was cloned at.
        counts:
          $ref: '#/components/schemas/ImportCounts'
      required:
        - stage

    ImportRunStatus:
      type: string
      enum:
        - running
        - success
        - failed
      description: An import_runs row's status.

    ImportRunSummary:
      type: object
      description: One import_runs row, for the admin history screen.
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/ImportRunStatus'
        repoUrl:
          type:
            - string
            - "null"
          nullable: true
          description: The content_repos URL this run came from, or null for a local-directory import.
        courseSlug:
          type:
            - string
            - "null"
          nullable: true
          description: >-
            The manifest's slug, when known — null only when the manifest
            itself couldn't be read (design §7's course_slug rationale).
        commitSha:
          type:
            - string
            - "null"
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - "null"
          format: date-time
          nullable: true
          description: Null while status is 'running' (a process that died mid-import).
        counts:
          description: Present on a successful run, otherwise null.
          oneOf:
            - $ref: '#/components/schemas/ImportCounts'
            - type: "null"
        error:
          type:
            - string
            - "null"
          nullable: true
          description: The failure's summary message, or null on success.
        problems:
          type: array
          items:
            type: string
          description: >-
            The full file:line problem list for a failed run (design §8),
            or empty when there isn't one.
      required:
        - id
        - status
        - repoUrl
        - courseSlug
        - commitSha
        - startedAt
        - finishedAt
        - counts
        - error
        - problems

    SetupStatus:
      type: object
      description: Whether this instance has been claimed (design §5.2)
      properties:
        bootstrapped:
          type: boolean
          description: True once the first account has claimed the instance.
      required:
        - bootstrapped

    SetupAccount:
      type: object
      description: One half of the linked pair the bootstrap wizard creates
      properties:
        email:
          type: string
          description: Lower-cased before storage; unique across the instance.
        handle:
          type: string
          description: >-
            The profile handle (`/u/<handle>`), 2-31 characters of a-z, 0-9,
            hyphen or underscore. User-chosen and deliberately NOT derived
            from the email local part (design §11).
        password:
          type: string
          minLength: 12
          maxLength: 200
          description: >-
            At least 12 characters. Hashed with Argon2id (design §13) by the
            password-handling task; stored as NULL — meaning "no credential,
            cannot authenticate" — until that is wired in.
        displayName:
          type: string
          nullable: true
          description: Optional human name shown on the profile.
      required:
        - email
        - handle
        - password

    SetupRequest:
      type: object
      description: The bootstrap wizard's submission (design §5.2)
      properties:
        setupToken:
          type: string
          description: >-
            The one-time token printed to the container logs on boot. Only
            its SHA-256 is stored, and it is destroyed by a successful claim.
        admin:
          $ref: '#/components/schemas/SetupAccount'
        student:
          $ref: '#/components/schemas/SetupAccount'
        timezone:
          type: string
          nullable: true
          description: An IANA time zone name applied to both accounts (design §15).
      required:
        - setupToken
        - admin
        - student

    SetupAccountResult:
      type: object
      description: An account created by the bootstrap
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        handle:
          type: string
        displayName:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
              - student
              - teacher
              - admin
          description: >-
            The roles granted at creation. Roles are a set, not a ladder, and
            `admin` is exclusive of the other two (design §5, §5.1).
      required:
        - id
        - email
        - handle
        - displayName
        - roles

    SetupResult:
      type: object
      description: The linked operator + student pair (design §5.2)
      properties:
        admin:
          $ref: '#/components/schemas/SetupAccountResult'
        student:
          $ref: '#/components/schemas/SetupAccountResult'
      required:
        - admin
        - student

    LoginRequest:
      type: object
      description: An email/password sign-in attempt (design §13).
      properties:
        email:
          type: string
          description: Case-insensitive; surrounding whitespace is trimmed server-side.
        password:
          type: string
        deviceLabel:
          type: string
          nullable: true
          description: >-
            Optional human label for this device/session (design §13: "one
            per device"). A fresh login with the same label supersedes that
            device's previous session.
      required:
        - email
        - password

    AuthUser:
      type: object
      description: >-
        The signed-in account, returned by login and refresh. Not the same
        shape as Me (design §15's learner profile) — this is the session's
        identity claim, roles included, and email/handle/displayName may be
        null exactly when the underlying users row has them unset.
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
            - string
            - "null"
          nullable: true
        handle:
          type:
            - string
            - "null"
          nullable: true
        displayName:
          type:
            - string
            - "null"
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum:
              - student
              - teacher
              - admin
          description: >-
            The actor's current roles, re-read from the database at
            login/refresh time (design §5.1: admin is exclusive).
      required:
        - id
        - email
        - handle
        - displayName
        - roles

    AuthSessionResponse:
      type: object
      description: The body of a successful login or refresh.
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
      required:
        - user
