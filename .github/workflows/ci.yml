name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: learn_test
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: ci_password_for_testing_only
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        env:
          TEST_DATABASE_URL: postgres://learn:ci_password_for_testing_only@localhost:5432/learn_test
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://learn:ci_password_for_testing_only@localhost:5432/learn_test
        run: npm test

      - name: Check generated API types are up-to-date
        run: npm run gen:api:check
