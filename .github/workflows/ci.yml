name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # One database in CI. Both vars point at it: `npm run migrate` reads
    # DATABASE_URL, the test suite reads TEST_DATABASE_URL. Setting these at job
    # level rather than per step is deliberate — the two drifted apart when they
    # were duplicated, and migrate failed with "DATABASE_URL is not set".
    env:
      DATABASE_URL: postgres://learn:ci_password_for_testing_only@localhost:5432/learn_test
      TEST_DATABASE_URL: postgres://learn:ci_password_for_testing_only@localhost:5432/learn_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: learn_test
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: ci_password_for_testing_only
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # The runner ships pg_dump 16, and pg_dump refuses to dump a newer
      # server ("aborting because of server version mismatch"). The service
      # container is postgres:17, so the backup/restore tests fail in CI while
      # passing locally. Install the matching client tools from PGDG.
      - name: Install PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # `npm run typecheck` does NOT cover web/: Next generates its own
      # tsconfig, which is not in the root project's references. So `next build`
      # is the only thing that type-checks the web app — and until now CI never
      # ran it, meaning web type errors could reach main undetected. Two real
      # bugs were found this way in Phase 9 alone.
      - name: Build web
        run: npm run build --workspace web

      - name: Check generated API types are up-to-date
        run: npm run gen:api:check

      # Phase 15: the Playwright harness. Chromium only (task 1's decision —
      # installing three browser engines here would be pure cost with
      # nothing exercising the other two yet).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer entries do their own `npm run
      # migrate` + `node tools/src/e2e-seed.ts` + build/start of both the API
      # and the web app against TEST_DATABASE_URL (already set at job level,
      # above) — this step needs nothing beyond the browser install above.
      - name: E2E tests (Playwright)
        run: npx playwright test
