# Compose v2 ignores `version:` and warns about it; it is deliberately absent.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learn_dev}
      POSTGRES_USER: ${POSTGRES_USER:-learn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-learn}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: npm run migrate
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learn}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-learn_dev}

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learn}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-learn_dev}
      API_PORT: '3001'
      # The API's direct peer here is the `web` container (and, in front of
      # that, whatever proxy terminates TLS), never the visitor. Without this
      # every request carries the same source address and the per-IP rate
      # limiters collapse into ONE bucket shared by everybody — five failed
      # logins would lock out the whole instance.
      #
      # `private` and not `true`: `true` trusts every hop, which lets a client
      # forge X-Forwarded-For and give itself a fresh bucket per request. See
      # api/src/auth/trust-proxy.ts.
      API_TRUST_PROXY: ${API_TRUST_PROXY:-private}
    # No healthcheck override. api.Dockerfile declares one, pointing at a
    # committed script — see the note there for why an inline `node -e` probe
    # in a compose file is a bad idea.
  # CRITICAL ARCHITECTURAL RULE 1: web MUST NEVER receive DATABASE_URL.
  # The web service only receives NEXT_PUBLIC_API_BASE_URL and WEB_PORT.
  # It communicates with the API exclusively over HTTP.
  # This is the single most important security boundary in the application.
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      # NEXT_PUBLIC_* is inlined by `next build`, so this has to be a BUILD
      # arg. Passing it only under `environment:` below — which is all this
      # file used to do — leaves the bundle pointing nowhere and every page
      # failing at runtime. See web.Dockerfile for the full note.
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:3001}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:3001}
      WEB_PORT: '3000'

volumes:
  postgres_data:
