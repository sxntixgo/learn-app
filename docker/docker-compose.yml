version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learn_dev}
      POSTGRES_USER: ${POSTGRES_USER:-learn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-learn}']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: npm run migrate
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learn}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-learn_dev}

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-learn}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-learn_dev}
      API_PORT: '3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # CRITICAL ARCHITECTURAL RULE 1: web MUST NEVER receive DATABASE_URL.
  # The web service only receives NEXT_PUBLIC_API_BASE_URL and WEB_PORT.
  # It communicates with the API exclusively over HTTP.
  # This is the single most important security boundary in the application.
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:3001}
      WEB_PORT: '3000'

volumes:
  postgres_data:
